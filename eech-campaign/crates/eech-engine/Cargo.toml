[package]
name = "eech-engine"
version = "0.1.0"
description = "Safe Rust API over the headless EECH engine: boot a dynamic campaign, run frames, observe the world."
edition.workspace = true
publish.workspace = true

[dependencies]
eech-engine-sys = { path = "../eech-engine-sys" }
serde = { workspace = true }

[features]
# TEST-ONLY (EEDCS-40): see eech-engine-sys.
dependent-fixture = ["eech-engine-sys/dependent-fixture"]
dependent-fixture-old-guard = ["eech-engine-sys/dependent-fixture-old-guard"]
# TEST-ONLY (EEDCS-41): see eech-engine-sys.
loss-fixture = ["eech-engine-sys/loss-fixture"]
# TEST-ONLY (EEDCS-42): see eech-engine-sys.
los-fixture = ["eech-engine-sys/los-fixture"]
# TEST-ONLY (EEDCS-43): see eech-engine-sys.
sensor-fixture = ["eech-engine-sys/sensor-fixture"]
# TEST-ONLY (EEDCS-47): see eech-engine-sys.
terrain-fixture = ["eech-engine-sys/terrain-fixture"]
# TEST-ONLY (EEDCS-44): see eech-engine-sys.
aim-fixture = ["eech-engine-sys/aim-fixture"]
weapon-fixture = ["eech-engine-sys/weapon-fixture"]
# TEST-ONLY (EEDCS-49): see eech-engine-sys.
collision-fixture = ["eech-engine-sys/collision-fixture"]
# TEST-ONLY (EEDCS-50): see eech-engine-sys.
model-fixture = ["eech-engine-sys/model-fixture"]
# TEST-ONLY (EEDCS-50 D3): see eech-engine-sys.
model-host-fixture = ["eech-engine-sys/model-host-fixture"]
# TEST SUPPORT (EEDCS-50, D3): see eech-engine-sys.
fpu-test-support = ["eech-engine-sys/fpu-test-support"]
# TEST-ONLY (EEDCS-51): see eech-engine-sys.
env-fixture = ["eech-engine-sys/env-fixture"]
# TEST-ONLY (EEDCS-51): see eech-engine-sys.
env-observer = ["env-fixture", "eech-engine-sys/env-observer"]
# TEST-ONLY (EEDCS-48): see eech-engine-sys.
ground-fixture = ["eech-engine-sys/ground-fixture"]
# TEST-ONLY (EEDCS-50, D3): see eech-engine-sys.
route-fixture = ["eech-engine-sys/route-fixture"]
# TEST-ONLY (EEDCS-49, D3): see eech-engine-sys.
sector-height-observer = ["eech-engine-sys/sector-height-observer"]
# TEST-ONLY (EEDCS-49, D3): see eech-engine-sys.
sector-height-funnel-check = ["sector-height-observer", "eech-engine-sys/sector-height-funnel-check"]
# TEST-ONLY (EEDCS-49, D3): see eech-engine-sys.
sector-height-witness = ["eech-engine-sys/sector-height-witness"]
# TEST-ONLY (EEDCS-50, D3): see eech-engine-sys.
route-original = ["eech-engine-sys/route-original"]
# TEST-ONLY (EEDCS-52, D3): see eech-engine-sys.
target-point-fixture = ["eech-engine-sys/target-point-fixture"]
# TEST-ONLY (EEDCS-49, D3, Task49): the supply arrival descriptor control of the UPDATED word: see eech-engine-sys. With it on, `eech_engine::supply_check` hands the engine's OWN `supply_reached` boundary to the test; absent from every other build.
physical-flags-supply-check = ["eech-engine-sys/physical-flags-supply-check"]

[dev-dependencies]
# the flag control's test host: the REAL store of eech-world behind the engine's model callback (the same support file as eech-engine-sys/tests/physical_flags_consumer.rs)
eech-world = { path = "../eech-world" }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[[test]]
name = "physical_flags_supply"
path = "tests/physical_flags_supply.rs"
required-features = ["physical-flags-supply-check"]

[[test]]
name = "sector_height_observer_chain"
path = "tests/sector_height_observer_chain.rs"
required-features = ["sector-height-observer"]

[[test]]
name = "sector_height_observer_cap"
path = "tests/sector_height_observer_cap.rs"
required-features = ["sector-height-observer"]

[[test]]
name = "sector_height_funnel"
path = "tests/sector_height_funnel.rs"
required-features = ["sector-height-funnel-check"]
