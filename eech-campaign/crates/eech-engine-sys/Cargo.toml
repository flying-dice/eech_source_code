[package]
name = "eech-engine-sys"
version = "0.1.0"
description = "Private native layer: ALL of EECH (the maintained Windows build's 1,225 C files) compiled headless for the host, with its raw FFI."
edition.workspace = true
publish.workspace = true
links = "eech_engine"
build = "build/main.rs"

[build-dependencies]
cc = { version = "1.2", features = ["parallel"] }
