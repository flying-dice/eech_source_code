[package]
name = "eech-engine-sys"
version = "0.1.0"
description = "Private native layer: ALL of EECH (the maintained Windows build's 1,226 C files) compiled headless for the host, with its raw FFI."
edition.workspace = true
publish.workspace = true
links = "eech_engine"
build = "build/main.rs"

[features]
# TEST-ONLY (EEDCS-40): the dependent-positioning fixture driver. Never enabled in the shipping build.
dependent-fixture = []
# TEST-ONLY red build: dependent-fixture with the pre-EEDCS-40 boolean apply guard, applied to the staged copy only.
dependent-fixture-old-guard = ["dependent-fixture"]
# TEST-ONLY (EEDCS-41): the all-family loss trigger. Never enabled in the shipping build.
loss-fixture = []
# TEST-ONLY (EEDCS-42): the line-of-sight characterisation trace and probe. Never enabled in the shipping build.
los-fixture = []
# TEST-ONLY (EEDCS-43): the sensor-detection characterisation trace and probe. Never enabled in the shipping build.
sensor-fixture = []
# TEST-ONLY (EEDCS-47): the terrain surface characterisation trace and probe. Never enabled in the shipping build.
terrain-fixture = []
# TEST-ONLY (EEDCS-44): the physical weapon-aiming characterisation trace. Never enabled in the shipping build.
aim-fixture = []
# TEST-ONLY (EEDCS-45): the physical weapon-execution characterisation trace, event log and controlled launch case. Never enabled in the shipping build.
weapon-fixture = []
# TEST-ONLY (EEDCS-51): the original session environment (weather, wind, clock) characterisation. Never enabled in the shipping build.
env-fixture = []

[build-dependencies]
cc = { version = "1.2", features = ["parallel"] }
