# The EECH headless harness: a world host that runs the world engine and a
# Lua 5.1 state which loads the dynamic campaign DLL (require ("eech_dc")),
# exactly as a simulator host (DCS World) would. Records Tacview.
[package]
name = "eech-world"
version = "0.1.0"
description = "EECH headless harness: world engine + Lua port host for the dynamic campaign DLL; Tacview recording."
edition.workspace = true
publish.workspace = true

[dependencies]
mlua = { version = "0.10", features = ["lua51", "module", "serialize"] }
serde.workspace = true
serde_json.workspace = true
