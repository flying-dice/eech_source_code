# The EECH dynamic campaign, the whole headless engine, as a Lua 5.1 native
# module (cdylib): a host loads it with require ("eech_dc") in its Lua state
# and drives the campaign from Lua. Modelled on the reference Lua module
# crate, flying-dice/dcs-studio bridge (mlua 0.10, lua51 + module).
[package]
name = "eech-dc"
version = "0.1.0"
description = "The EECH dynamic campaign (the full headless engine) as a Lua 5.1 native module: require (\"eech_dc\")."
edition.workspace = true
publish.workspace = true

# mlua derives `luaopen_eech_dc` from the lib name, and require ("eech_dc")
# resolves the DLL basename: the two must match.
[lib]
name = "eech_dc"
crate-type = ["cdylib", "rlib"]

[dependencies]
eech-engine = { path = "../eech-engine" }
# No `macros`: `#[mlua::lua_module]` comes from `module` (as in the reference crate)
mlua = { version = "0.10", features = ["lua51", "module", "serialize"] }
serde.workspace = true
serde_json.workspace = true

[features]
# TEST-ONLY Core loader CRT observer; never a shipping profile.
core-terrain-crt-observer = ["eech-engine/core-terrain-crt-observer"]
# TEST-ONLY (EEDCS-40): the dependent-positioning fixture driver. Never enabled in the shipping build.
dependent-fixture = ["eech-engine/dependent-fixture"]
dependent-fixture-old-guard = ["dependent-fixture", "eech-engine/dependent-fixture-old-guard"]
# TEST-ONLY (EEDCS-41): the all-family loss trigger. Never enabled in the shipping build.
loss-fixture = ["eech-engine/loss-fixture"]
# TEST-ONLY (EEDCS-42): the line-of-sight characterisation trace and probe. Never enabled in the shipping build.
los-fixture = ["eech-engine/los-fixture"]
# TEST-ONLY (EEDCS-43): the sensor-detection characterisation trace and probe. Never enabled in the shipping build.
sensor-fixture = ["eech-engine/sensor-fixture"]
# TEST-ONLY (EEDCS-47): the terrain surface characterisation trace and probe. Never enabled in the shipping build.
terrain-fixture = ["eech-engine/terrain-fixture"]
# TEST-ONLY (EEDCS-44): the physical weapon-aiming characterisation trace. Never enabled in the shipping build.
aim-fixture = ["eech-engine/aim-fixture"]
# TEST-ONLY (EEDCS-45): the physical weapon-execution characterisation trace, event log and controlled launch case. Never enabled in the shipping build.
weapon-fixture = ["eech-engine/weapon-fixture"]
# TEST-ONLY (EEDCS-49): the object and tree collision characterisation probe. Never enabled in the shipping build.
collision-fixture = ["eech-engine/collision-fixture"]
# TEST-ONLY (EEDCS-50): read-only questions to the original collision-model accessors. Never enabled in the shipping build.
model-fixture = ["eech-engine/model-fixture"]
# TEST-ONLY (EEDCS-50 D3): the shipping host-owned model data plus a diagnostic that counts the host's answers and overwrites the campaign's own model arrays. Never enabled in the shipping build.
model-host-fixture = ["eech-engine/model-host-fixture"]
# TEST-ONLY (EEDCS-51): the original session environment (weather, wind, clock) characterisation. Never enabled in the shipping build.
env-fixture = ["eech-engine/env-fixture"]
# TEST-ONLY (EEDCS-51): the read-only observer of the original environment initialisation, shared-entropy order, lightning/sound effects and frame time phase. Never enabled in the shipping build.
env-observer = ["env-fixture", "eech-engine/env-observer"]
# TEST-ONLY (EEDCS-48): the ground-contact characterisation probe. Never enabled in the shipping build.
ground-fixture = ["eech-engine/ground-fixture"]
# TEST-ONLY (EEDCS-50, D3): the observer of the original airfield route parser (route_summary and route_call). Never enabled in the shipping build.
route-fixture = ["eech-engine/route-fixture"]
# TEST-ONLY (EEDCS-49, D3): the read-only observer of the sector tallest-structure word (sector_height_summary, _event, _clearance, _scan). Never enabled in the shipping build.
sector-height-observer = ["eech-engine/sector-height-observer"]
# TEST-ONLY (EEDCS-49, D3): the fixture method of the native server-session witness (session:sector_height_witness_save). Never enabled in the shipping build.
sector-height-witness = ["eech-engine/sector-height-witness"]
# TEST-ONLY (EEDCS-50, D3): keep the original airfield route parser (the original route characterisation). Never enabled in the shipping build.
route-original = ["eech-engine/route-original"]
# TEST-ONLY (EEDCS-52, D3): the observer of the original target-point query and offset census (target_point_summary, target_point_offsets, target_point_event). Never enabled in the shipping build.
target-point-fixture = ["eech-engine/target-point-fixture"]

# Code that runs inside a host's process: a panic in this DLL takes the host
# down. The reference crate's restriction lints, denied here.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
exit = "deny"
indexing_slicing = "deny"

[lints.rust]
unsafe_code = "forbid"

# The Lua provider's number parsing is tested under round-toward-zero, as the engine entry runs a callback (EEDCS-50, D3).
[dev-dependencies]
eech-engine = { path = "../eech-engine", features = ["fpu-test-support"] }
# the real host provider answers a physical flag question through this bridge (EEDCS-49, Task49)
eech-world = { path = "../eech-world" }
