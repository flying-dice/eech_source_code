[workspace]
resolver = "2"
members = ["crates/eech-sys", "crates/eech-engine-sys", "crates/eech-engine", "crates/eech-campaign", "crates/eech-harness", "crates/eech-dc", "crates/eech-world", "crates/eech-map"]

[workspace.package]
edition = "2021"
license-file = "../LICENCE"
publish = false
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# mlua-sys 0.6.8 with LUA_IDSIZE 256 for DCS World's Lua (patches/mlua-sys-0.6.8/PATCH.md)
[patch.crates-io]
mlua-sys = { path = "patches/mlua-sys-0.6.8" }
